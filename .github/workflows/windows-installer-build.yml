name: CINEMATIC STUDIO — Windows Installer Build & Packaging

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-installer:
    name: Build Windows x64 Installer (MSI & NSIS)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust Toolchain (Stable MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Node Dependencies
        run: npm ci

      - name: Acquire & Verify Bundled FFmpeg Media Engine
        run: node scripts/acquire_ffmpeg.cjs

      - name: Verify Bundled Media Engine Checksums & PE Headers
        run: node scripts/inspect_pe.cjs

      - name: Execute Automated Test Suites
        run: |
          node tests/combined_phase1_2_validation.cjs
          node tests/phase3_provider_matrix_test.cjs
          node tests/phase4_media_assembly_test.cjs
          node tests/phase4_runtime_hardening_test.cjs
          node tests/media_engine_resolver_test.cjs
          node tests/real_media_rendering_test.cjs
          node tests/final_rendering_regression_suite.cjs
          node tests/option_a_chrome_embedding_suite.cjs
          node tests/v4_ultimate_rebuild_suite.cjs

      - name: Build Frontend Production Bundle
        run: npm run build

      - name: Package Chrome Extension ZIP
        run: node scripts/package_extension.cjs

      - name: Build Chrome Native Messaging Host Binary
        run: cargo build --release --bin cinematic-studio-host --manifest-path src-tauri/Cargo.toml

      - name: Stage Native Messaging Host for Installer Packaging
        shell: pwsh
        run: |
          $binDir = "src-tauri/resources/bin"
          if (!(Test-Path $binDir)) { New-Item -ItemType Directory -Force -Path $binDir }
          Copy-Item "src-tauri/target/release/cinematic-studio-host.exe" "$binDir/cinematic-studio-host.exe" -Force
          Write-Host "Staged cinematic-studio-host.exe into resources/bin/"

      - name: Build Tauri Desktop Application & Installers
        run: npx tauri build --verbose

      - name: Verify Generated Installer Packages
        shell: pwsh
        run: |
          $bundlePath = "src-tauri/target/release/bundle"
          if (Test-Path $bundlePath) {
            Write-Host "Discovered Bundle Output Directory:"
            Get-ChildItem -Recurse $bundlePath | Select-Object FullName, Length | Format-Table
          } else {
            Write-Error "Bundle directory was not created!"
            exit 1
          }

      - name: Stage Release Artifacts & Extension Package
        shell: pwsh
        run: |
          $releaseDir = "release_artifacts"
          New-Item -ItemType Directory -Force -Path $releaseDir

          Copy-Item src-tauri/target/release/bundle/nsis/*.exe $releaseDir/ -Force
          Copy-Item src-tauri/target/release/bundle/msi/*.msi $releaseDir/ -Force
          Copy-Item src-tauri/target/release/cinematic-studio-host.exe $releaseDir/ -Force

          node scripts/package_extension.cjs
          if (Test-Path "dist/cinematic-studio-chrome-extension.zip") {
            Copy-Item dist/cinematic-studio-chrome-extension.zip $releaseDir/ -Force
          } elseif (Test-Path "chrome-extension/cinematic-studio-chrome-extension.zip") {
            Copy-Item chrome-extension/cinematic-studio-chrome-extension.zip $releaseDir/ -Force
          } else {
            Write-Error "Chrome Extension package not found!"
            exit 1
          }

          # Normalize filenames: replace spaces with dots to match GitHub Release asset URLs
          $files = Get-ChildItem -Path $releaseDir -File
          foreach ($file in $files) {
            if ($file.Name.Contains(" ")) {
              $newName = $file.Name -replace ' ', '.'
              $newPath = Join-Path $releaseDir $newName
              Move-Item -Path $file.FullName -Destination $newPath -Force
            }
          }

      # Option 1: Microsoft Trusted Signing (formerly Azure Code Signing / Artifact Signing)
      - name: Sign Executables with Microsoft Trusted Signing
        if: env.AZURE_CLIENT_ID != '' && env.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME != ''
        uses: azure/trusted-signing-action@v0.5.1
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT || 'https://wus.codesigning.azure.net/' }}
          code-signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE_NAME }}
          files-folder: release_artifacts
          files-folder-filter: exe,msi
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.digicert.com
          timestamp-digest: SHA256

      # Option 2: Standard Authenticode PFX via signtool.exe (OV/EV Certificate)
      - name: Sign Executables with Authenticode PFX
        if: env.HAS_AZURE_SIGNING != 'true'
        shell: pwsh
        env:
          HAS_AZURE_SIGNING: ${{ secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME != '' }}
          WINDOWS_CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK || secrets.CSC_LINK }}
          WINDOWS_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD || secrets.CSC_KEY_PASSWORD }}
        run: |
          if ($env:WINDOWS_CSC_LINK -and $env:WINDOWS_CSC_KEY_PASSWORD) {
            Write-Host "Authenticode PFX code-signing certificate detected. Preparing signtool..."
            $pfxPath = "$env:RUNNER_TEMP\authenticode_cert.pfx"
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CSC_LINK))

            $signtool = (Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Filter "signtool.exe" -Recurse | Select-Object -First 1).FullName
            if (!$signtool) {
              Write-Error "signtool.exe not found on runner!"
              exit 1
            }

            $filesToSign = Get-ChildItem -Path "release_artifacts" -Include *.exe,*.msi -Recurse
            foreach ($file in $filesToSign) {
              Write-Host "Signing $($file.Name) with RFC 3161 timestamp..."
              & $signtool sign /f $pfxPath /p $env:WINDOWS_CSC_KEY_PASSWORD /fd SHA256 /tr "http://timestamp.digicert.com" /td SHA256 /d "Cinematic Studio" $file.FullName
              if ($LASTEXITCODE -ne 0) {
                Write-Error "Signing failed for $($file.FullName)!"
                exit 1
              }
            }
            Remove-Item $pfxPath -Force
            Write-Host "Authenticode PFX signing completed successfully."
          } else {
            Write-Host "=========================================================================="
            Write-Host "[WARNING] No Code-Signing Credentials Configured in GitHub Secrets."
            Write-Host "  - Neither Microsoft Trusted Signing (AZURE_*) nor Authenticode PFX (WINDOWS_CSC_*)"
            Write-Host "    secrets were detected."
            Write-Host "  - Generated release packages will be UNSIGNED."
            Write-Host "  - Windows 11 Smart App Control will BLOCK installation with:"
            Write-Host "    'We blocked this app because we could not verify its publisher.'"
            Write-Host "=========================================================================="
          }

      - name: Verify Authenticode Signatures & Certificate Chain
        shell: pwsh
        run: |
          Write-Host "=========================================================================="
          Write-Host "AUTHENTICODE SIGNATURE VERIFICATION AUDIT"
          Write-Host "=========================================================================="
          $files = Get-ChildItem -Path "release_artifacts" -Include *.exe,*.msi -Recurse
          $allSigned = $true
          foreach ($file in $files) {
            $sig = Get-AuthenticodeSignature -FilePath $file.FullName
            Write-Host "File: $($file.Name)"
            Write-Host "  Status:      $($sig.Status)"
            Write-Host "  Signer:      $($sig.SignerCertificate.Subject)"
            Write-Host "  Issuer:      $($sig.SignerCertificate.Issuer)"
            Write-Host "  TimeStamper: $($sig.TimeStamperCertificate.Subject)"
            Write-Host "  Thumbprint:  $($sig.SignerCertificate.Thumbprint)"
            Write-Host ""
            if ($sig.Status -ne "Valid") {
              $allSigned = $false
            }
          }
          if (!$allSigned) {
            Write-Host "[AUDIT NOTICE] Some or all binaries are not signed with a valid trusted Authenticode signature."
          } else {
            Write-Host "[SUCCESS] All distributed executables have valid Authenticode digital signatures."
          }

      - name: Generate Release Checksums (SHA256SUMS.txt)
        shell: pwsh
        run: |
          $releaseDir = "release_artifacts"
          $hashLines = @()
          $files = Get-ChildItem -Path $releaseDir -File
          foreach ($file in $files) {
            if ($file.Name -ne "SHA256SUMS.txt") {
              $hash = (Get-FileHash -Path $file.FullName -Algorithm SHA256).Hash
              $hashLines += "$hash  $($file.Name)"
            }
          }
          $hashFile = Join-Path $releaseDir "SHA256SUMS.txt"
          Set-Content -Path $hashFile -Value $hashLines -Encoding utf8

          Write-Host "Generated SHA256SUMS.txt:"
          Get-Content $hashFile

      - name: Upload Installer Packages Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cinematic-studio-windows-installer-${{ github.ref_name }}
          path: |
            release_artifacts/*
          retention-days: 30

      - name: Publish Official GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_artifacts/*
          name: CINEMATIC STUDIO ${{ github.ref_name }} — AI Film Production Studio & Professional Video Editor
          body: |
            # CINEMATIC STUDIO ${{ github.ref_name }} — AI Film Production Studio & Professional Video Editor

            **Developer & Architect:** Md. Sohag Hossen
            **Repository:** https://github.com/Sohag446/CINEMATIC-STUDIO
            **Operating System:** Windows 11 / Windows 10 x64
            **Release Target:** ${{ github.ref_name }} (Production Release)

            ---

            ## 🚀 What's New in ${{ github.ref_name }}

            1. **Option B In-Workspace Native Chrome Integration:**
               - Genuine `chrome.exe` docked directly inside the AI Workspace panel via Win32 container reparenting.
               - Dynamic viewport synchronization on window resize, maximize, minimize, and restore.
               - Full keyboard, mouse, and scrolling support for Google Flow/Veo, ChatGPT, Gemini, and Claude.
               - Multi-profile isolation and session persistence across application restarts.
               - Companion Window mode retained as a selectable fallback.

            2. **Decoupled Real-Time Playback Clock:**
               - Replaced element-dependent playback ticks with an independent `requestAnimationFrame` master timeline clock.
               - Video plays smoothly across cuts, gaps, and transitions without freezing.
               - CSP hardened to explicitly allow `blob:`, `asset:`, `http://asset.localhost`, and `https://asset.localhost`.

            3. **Interactive Mouse Trimming & Move:**
               - Multitrack timeline clips feature left-edge trim, right-edge trim, and drag-to-move handlers.
               - Split at playhead position, duplicate, delete, and multi-track reordering.

            4. **23-Point AI Film Production Engine:**
               - Natural language duration parsing supporting $30\text{s}$ (3 scenes), $1\text{m}$ (6 scenes), $10\text{m}$ (60 scenes), up to $2\text{h}$ (720 scenes).
               - Generates complete cinematography, camera framing, lighting setups, dialogue, foley, and continuity locks.

            5. **CapCut-Grade Professional Multi-Track Video Editor:**
               - Multi-track timeline (Tracks V1-V3, A1-A3, and Text Overlay) with drag-and-drop from the Media Library.
               - Full Undo / Redo (`Ctrl+Z`, `Ctrl+Y`).
               - Comprehensive Desktop Inspector with Transform, Speed, Audio Detach to A1, and Color Grading.

            6. **Production FFmpeg Master MP4 Rendering:**
               - Multi-track composite rendering with picture-in-picture, audio mixing, and stream normalization via bundled Gyan FFmpeg 9.0.2.

            ---

            ## 📦 Installation Packages & Downloads

            | Deliverable | Package File | Scope & Recommended Use |
            | :--- | :--- | :--- |
            | **Windows NSIS Setup (Recommended)** | `Cinematic.Studio_*_x64-setup.exe` | Per-user desktop installation (%LOCALAPPDATA%\Programs), no UAC admin required |
            | **Windows MSI Installer** | `Cinematic.Studio_*_x64_en-US.msi` | Windows Installer package with stable WiX UpgradeCode |
            | **Chrome Extension (MV3)** | `cinematic-studio-chrome-extension.zip` | Manifest V3 Chrome Extension package for side-loading (`chrome://extensions`) |
            | **Native Messaging Host** | `cinematic-studio-host.exe` | Standalone Chrome native messaging host binary |
            | **Integrity Checksums** | `SHA256SUMS.txt` | SHA-256 cryptographic hashes for all release artifacts |
          draft: false
          prerelease: false
