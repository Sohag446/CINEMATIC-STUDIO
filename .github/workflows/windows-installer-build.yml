name: CINEMATIC STUDIO — Windows Installer Build & Packaging

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-installer:
    name: Build Windows x64 Installer (MSI & NSIS)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust Toolchain (Stable MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Node Dependencies
        run: npm ci

      - name: Acquire & Verify Bundled FFmpeg Media Engine
        run: node scripts/acquire_ffmpeg.cjs

      - name: Verify Bundled Media Engine Checksums & PE Headers
        run: node scripts/inspect_pe.cjs

      - name: Execute Automated Test Suites
        run: |
          node tests/combined_phase1_2_validation.cjs
          node tests/phase3_provider_matrix_test.cjs
          node tests/phase4_media_assembly_test.cjs
          node tests/phase4_runtime_hardening_test.cjs
          node tests/media_engine_resolver_test.cjs
          node tests/real_media_rendering_test.cjs
          node tests/final_rendering_regression_suite.cjs
          node tests/option_a_chrome_embedding_suite.cjs

      - name: Build Frontend Production Bundle
        run: npm run build

      - name: Package Chrome Extension ZIP
        run: node scripts/package_extension.cjs

      - name: Build Chrome Native Messaging Host Binary
        run: cargo build --release --bin cinematic-studio-host --manifest-path src-tauri/Cargo.toml

      - name: Stage Native Messaging Host for Installer Packaging
        shell: pwsh
        run: |
          $binDir = "src-tauri/resources/bin"
          if (!(Test-Path $binDir)) { New-Item -ItemType Directory -Force -Path $binDir }
          Copy-Item "src-tauri/target/release/cinematic-studio-host.exe" "$binDir/cinematic-studio-host.exe" -Force
          Write-Host "Staged cinematic-studio-host.exe into resources/bin/"

      - name: Build Tauri Desktop Application & Installers
        run: npx tauri build --verbose

      - name: Verify Generated Installer Packages
        shell: pwsh
        run: |
          $bundlePath = "src-tauri/target/release/bundle"
          if (Test-Path $bundlePath) {
            Write-Host "Discovered Bundle Output Directory:"
            Get-ChildItem -Recurse $bundlePath | Select-Object FullName, Length | Format-Table
          } else {
            Write-Error "Bundle directory was not created!"
            exit 1
          }

      - name: Authenticode Code Signing & Signature Verification
        shell: pwsh
        env:
          WINDOWS_CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK || secrets.CSC_LINK }}
          WINDOWS_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD || secrets.CSC_KEY_PASSWORD }}
        run: |
          if ($env:WINDOWS_CSC_LINK -and $env:WINDOWS_CSC_KEY_PASSWORD) {
            Write-Host "Authenticode code-signing certificate detected. Preparing signtool..."
            $pfxPath = "$env:RUNNER_TEMP\authenticode_cert.pfx"
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CSC_LINK))

            $signtool = (Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Filter "signtool.exe" -Recurse | Select-Object -First 1).FullName
            if (!$signtool) {
              Write-Error "signtool.exe not found on runner!"
              exit 1
            }

            $filesToSign = Get-ChildItem -Path "src-tauri/target/release/bundle" -Include *.exe,*.msi -Recurse
            foreach ($file in $filesToSign) {
              Write-Host "Signing $($file.FullName)..."
              & $signtool sign /f $pfxPath /p $env:WINDOWS_CSC_KEY_PASSWORD /fd SHA256 /tr "http://timestamp.digicert.com" /td SHA256 /d "Cinematic Studio" $file.FullName
              if ($LASTEXITCODE -ne 0) {
                Write-Error "Signing failed for $($file.FullName)!"
                exit 1
              }
              Write-Host "Verifying signature..."
              & $signtool verify /pa /v $file.FullName
            }
            Remove-Item $pfxPath -Force
          } else {
            Write-Host "=========================================================================="
            Write-Host "[NOTICE] Authenticode signing secret (WINDOWS_CSC_LINK) is not configured."
            Write-Host "[NOTICE] Generating release packages with verified SHA-256 integrity checksums."
            Write-Host "[NOTICE] Smart App Control / SmartScreen reputation guidance provided in docs."
            Write-Host "=========================================================================="
          }

      - name: Prepare Staged Release Artifacts & Checksums
        shell: pwsh
        run: |
          $releaseDir = "release_artifacts"
          New-Item -ItemType Directory -Force -Path $releaseDir

          Copy-Item src-tauri/target/release/bundle/nsis/*.exe $releaseDir/ -Force
          Copy-Item src-tauri/target/release/bundle/msi/*.msi $releaseDir/ -Force
          Copy-Item src-tauri/target/release/cinematic-studio-host.exe $releaseDir/ -Force

          node scripts/package_extension.cjs
          if (Test-Path "dist/cinematic-studio-chrome-extension.zip") {
            Copy-Item dist/cinematic-studio-chrome-extension.zip $releaseDir/ -Force
          } elseif (Test-Path "chrome-extension/cinematic-studio-chrome-extension.zip") {
            Copy-Item chrome-extension/cinematic-studio-chrome-extension.zip $releaseDir/ -Force
          } else {
            Write-Error "Chrome Extension package not found!"
            exit 1
          }

          $hashLines = @()
          $files = Get-ChildItem -Path $releaseDir -File
          foreach ($file in $files) {
            if ($file.Name -ne "SHA256SUMS.txt") {
              $hash = (Get-FileHash -Path $file.FullName -Algorithm SHA256).Hash
              $hashLines += "$hash  $($file.Name)"
            }
          }
          $hashFile = Join-Path $releaseDir "SHA256SUMS.txt"
          Set-Content -Path $hashFile -Value $hashLines -Encoding utf8

          Write-Host "Generated SHA256SUMS.txt:"
          Get-Content $hashFile

      - name: Upload Installer Packages Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cinematic-studio-windows-installer-v3.0.0
          path: |
            release_artifacts/*
          retention-days: 30

      - name: Publish Official GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_artifacts/*
          name: CINEMATIC STUDIO ${{ github.ref_name }} — CapCut-Style AI Video Production Studio
          body: |
            # CINEMATIC STUDIO ${{ github.ref_name }} — CapCut-Style AI Video Production Studio

            **Developer & Architect:** Md. Sohag Hossen
            **Repository:** https://github.com/Sohag446/CINEMATIC-STUDIO
            **Operating System:** Windows 11 / Windows 10 x64

            ---

            ## 🚀 Major Features in v3.0.0

            1. **Simplified 5-Section Desktop Navigation:**
               - **Home:** Getting started overview, recent projects, workflow guide, and quick templates.
               - **AI Workspace:** Exactly two primary browser tabs:
                 - **Tab 1: AI Assistant** (ChatGPT Plus, Google Gemini, Claude 3.7).
                 - **Tab 2: AI Video Generator** (Google Flow / DeepMind Veo, Luma Dream Machine, Runway Gen-3).
                 - 5-Stage Story-to-Shot Breakdown drawer (Story -> Analysis -> Shots -> Direct -> Assemble).
               - **Projects:** Complete project catalog & canvas settings (16:9, 9:16, 1:1, 2.39:1, 24/30/60 FPS).
               - **Video Editor:** CapCut-style multitrack NLE video editor.
               - **Settings:** Clean settings, FFmpeg diagnostics, and system telemetry.

            2. **Real Video Preview & Decoding Player:**
               - Replaced static placeholder frames with a genuine HTML5 `<video ref={videoRef}>` decoding player.
               - Frame-accurate seek synchronization with timeline playhead.
               - Play/Pause, Frame-by-frame stepping (1/24s), Scrubbing slider, Timecode display, Volume slider, Mute toggle, and Safe Areas guide.

            3. **Functional CapCut-Style Multitrack Timeline:**
               - **Working Clip Split at Playhead:** Correctly divides clip into left and right segments, preserving both on the timeline.
               - **Trim Start & Trim End:** Precision trimming to current playhead position.
               - **Undo / Redo:** Full timeline state history with keyboard shortcuts (`Ctrl+Z`, `Ctrl+Y`).
               - **Duplicate & Delete:** Quick clip duplication and non-destructive deletion.
               - **Track Controls:** Track-level volume, mute, and lock controls.

            4. **Real FFmpeg Master MP4 Export:**
               - Direct export to H.264 / AAC MP4 with presets for 1080p Landscape, 9:16 Social Reels, 2K QHD, and 4K UHD.
               - Fully integrated bundled FFmpeg essentials.

            ---

            ## 📦 Installation Packages & Downloads

            | Deliverable | Package File | Scope & Recommended Use |
            | :--- | :--- | :--- |
            | **Windows NSIS Setup (Recommended)** | `Cinematic Studio_3.0.0_x64-setup.exe` | Per-user desktop installation (%LOCALAPPDATA%\Programs), no UAC admin required |
            | **Windows MSI Installer** | `Cinematic Studio_3.0.0_x64_en-US.msi` | Windows Installer package with stable WiX UpgradeCode |
            | **Chrome Extension (MV3)** | `cinematic-studio-chrome-extension.zip` | Manifest V3 Chrome Extension package for side-loading (`chrome://extensions`) |
            | **Native Messaging Host** | `cinematic-studio-host.exe` | Standalone Chrome native messaging host binary |
            | **Integrity Checksums** | `SHA256SUMS.txt` | SHA-256 cryptographic hashes for all release artifacts |
          draft: false
          prerelease: false
