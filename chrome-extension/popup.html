<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cinematic Studio Agent</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      background: #090d16;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 14px;
      font-size: 13px;
      user-select: none;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .brand {
      font-family: monospace;
      font-weight: 700;
      color: #f1f5f9;
      letter-spacing: 0.05em;
    }
    .brand span { color: #e50914; }
    .badge {
      font-size: 10px;
      font-family: monospace;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
      font-weight: 600;
    }
    .badge-connected { background: #064e3b; color: #34d399; border: 1px solid #059669; }
    .badge-pending { background: #78350f; color: #fcd34d; border: 1px solid #d97706; }
    .badge-disconnected { background: #1e293b; color: #94a3b8; border: 1px solid #334155; }
    .card {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 10px;
    }
    .field {
      margin-bottom: 8px;
    }
    .field label {
      display: block;
      font-size: 11px;
      color: #94a3b8;
      font-family: monospace;
      margin-bottom: 4px;
    }
    .field input {
      width: 100%;
      background: #020617;
      border: 1px solid #334155;
      color: #f8fafc;
      padding: 6px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-family: monospace;
    }
    .field input:focus {
      outline: none;
      border-color: #e50914;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 7px;
      background: #e50914;
      color: white;
      border: none;
      border-radius: 4px;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      text-align: center;
      transition: background 0.15s;
    }
    .btn:hover { background: #b80710; }
    .btn-secondary {
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
      margin-top: 6px;
    }
    .btn-secondary:hover { background: #334155; }
    .btn-danger {
      background: #450a0a;
      color: #fca5a5;
      border: 1px solid #991b1b;
      margin-top: 6px;
    }
    .btn-danger:hover { background: #7f1d1d; }
    .status-row {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      margin-bottom: 4px;
      color: #94a3b8;
    }
    .status-val {
      color: #f1f5f9;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">CINEMATIC<span>STUDIO</span></div>
    <div id="statusBadge" class="badge badge-disconnected">Checking...</div>
  </div>

  <div id="pairedView" style="display: none;">
    <div class="card">
      <div class="status-row">
        <span>Assigned Profile:</span>
        <span id="profileIdVal" class="status-val">--</span>
      </div>
      <div class="status-row">
        <span>Native Messaging:</span>
        <span id="nativeStatusVal" class="status-val">--</span>
      </div>
      <div class="status-row">
        <span>HMAC Handshake:</span>
        <span id="handshakeVal" class="status-val">--</span>
      </div>
    </div>
    <button id="btnTestConn" class="btn">Test Connection</button>
    <button id="btnUnpair" class="btn btn-danger">Unpair Profile</button>
  </div>

  <div id="unpairedView" style="display: none;">
    <div class="card">
      <div class="field">
        <label for="pairingInput">Paste Pairing Link or Token</label>
        <input type="text" id="pairingInput" placeholder="cinematic://pair?profile=...&secret=...">
      </div>
      <button id="btnPair" class="btn">Pair with Desktop</button>
    </div>
    <p style="font-size: 11px; color: #64748b; line-height: 1.4;">
      Initiate pairing from the CINEMATIC STUDIO desktop app under <strong>Chrome Profiles</strong>.
    </p>
  </div>

  <script src="popup.js"></script>
</body>
</html>
