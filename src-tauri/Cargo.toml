[package]
name = "cinematic-studio"
version = "2.0.2"
description = "Desktop-centered AI video production management platform"
authors = ["Md. Sohag Hossen <https://github.com/Sohag446>"]
edition = "2021"

[lib]
name = "cinematic_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "cinematic-studio"
path = "src/main.rs"

[[bin]]
name = "cinematic-studio-host"
path = "src/bin/host.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-shell = "2.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled", "chrono", "uuid"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sysinfo = "0.30"
log = "0.4"
env_logger = "0.11"
thiserror = "1.0"

[dev-dependencies]
tempfile = "3.10"


